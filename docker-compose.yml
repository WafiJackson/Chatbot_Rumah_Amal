services:
  # 1. Container untuk Logika Bot (FastAPI + Regex/Gemini Engine)
  api-bot:
    build: .
    image: rumah_amal_api_image:latest
    container_name: rumah_amal_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WAHA_ENDPOINT=http://waha-gateway:3000
      - WAHA_API_KEY=${WAHA_API_KEY:?WAHA_API_KEY wajib diisi di .env}
      - DB_PATH=/code/app_db/donatur.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sqlite_data:/code/app_db
    networks:
      - bot_network

  # 2. Container untuk Gateway WhatsApp (WAHA WebJS)
  waha-gateway:
    image: devlikeapro/waha
    container_name: rumah_amal_waha
    # TIDAK di-expose ke host/publik dengan sengaja - waha-gateway hanya perlu
    # diakses api-bot lewat jaringan internal bot_network. Kalau perlu buka
    # dashboard WAHA (mis. scan ulang QR), akses lewat SSH tunnel:
    #   ssh -L 3000:localhost:3000 user@vps-anda
    restart: unless-stopped
    environment:
      - WAHA_PRINT_QR=True
      - WAHA_ZIP_SESSIONS=True
      - WAHA_API_KEY=${WAHA_API_KEY:?WAHA_API_KEY wajib diisi di .env}
      - WAHA_API_KEY_SECRET=${WAHA_API_KEY:?WAHA_API_KEY wajib diisi di .env}
      - WHATSAPP_HOOK_URL=http://api-bot:8000/webhook
      - WHATSAPP_HOOK_EVENTS=message
    volumes:
      - waha_sessions:/tmp/waha-sessions
    networks:
      - bot_network

  # 3. Container untuk Reverse Proxy (Caddy) -- BARU DITAMBAHKAN
  caddy:
    image: caddy:2-alpine
    container_name: rumah_amal_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-bot
    networks:
      - bot_network

# 4. Jembatan Komunikasi Internal & Persistence Volume
networks:
  bot_network:
    driver: bridge

volumes:
  waha_sessions:
    driver: local
  sqlite_data:
    driver: local
  # BARU DITAMBAHKAN UNTUK CADDY
  caddy_data:
  caddy_config: